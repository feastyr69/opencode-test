<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Commander - Space Shooter</title>
    <!-- Pixel art font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #05060d;
            color: #fff;
            font-family: 'Press Start 2P', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            padding: 10px;
        }

        /* Top Bar navigation */
        .top-nav {
            width: 480px;
            max-width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
        }

        .back-link {
            color: #00f3ff;
            text-decoration: none;
            font-size: 10px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.6);
        }

        .back-link:hover {
            color: #fff;
            transform: translateX(-3px);
            text-shadow: 0 0 15px rgba(0, 243, 255, 1);
        }

        #game-container {
            position: relative;
            width: 480px;
            height: 640px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9), 0 0 20px rgba(0, 243, 255, 0.2), 0 0 0 4px #1c2138;
            border-radius: 12px;
            overflow: hidden;
            background-color: #080914;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Instructions and overlay stylings */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            text-align: center;
            padding: 25px;
            background: rgba(8, 9, 20, 0.75);
            backdrop-filter: blur(2px);
        }

        .title {
            font-size: 22px;
            color: #00f3ff;
            text-shadow: 0 0 15px #00f3ff, 0 0 30px #00f3ff, 3px 3px 0 #000;
            margin-bottom: 30px;
            animation: pulseGlow 2s infinite ease-in-out;
            line-height: 1.4;
        }

        .subtitle {
            font-size: 10px;
            line-height: 2.2;
            color: #e0e5ff;
            text-shadow: 0 0 8px rgba(224, 229, 255, 0.5);
            margin-bottom: 25px;
        }

        .blinking {
            animation: blink 1.2s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff, 2px 2px 0 #000; }
            50% { text-shadow: 0 0 20px #00f3ff, 0 0 40px #ff007f, 2px 2px 0 #000; color: #fff; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Volume Toggle Button */
        #mute-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(12, 14, 28, 0.8);
            border: 2px solid #00f3ff;
            color: #00f3ff;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 6px;
            font-family: inherit;
            font-size: 9px;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.3);
            z-index: 10;
        }

        #mute-btn:hover {
            background: rgba(0, 243, 255, 0.2);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.6);
        }

        /* Desktop responsiveness rules */
        @media (max-width: 520px) {
            #game-container {
                width: 100%;
                height: 80vh;
                box-shadow: none;
                border: 2px solid #00f3ff;
            }
        }

        .controls-hint {
            margin-top: auto;
            margin-bottom: 20px;
            font-size: 8px;
            color: #8c96c6;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <!-- Return to Opengame Portal -->
    <div class="top-nav">
        <a href="../../index.html" class="back-link">◀ OPENGAME LOBBY</a>
    </div>

    <div id="game-container">
        <!-- Audio Mute Control -->
        <button id="mute-btn">🔊 SOUND</button>
        
        <!-- Canvas Context -->
        <canvas id="gameCanvas" width="480" height="640"></canvas>

        <!-- Start Screen Overlay -->
        <div id="start-screen" class="overlay">
            <h1 class="title">NEON<br>COMMANDER</h1>
            <div class="subtitle blinking">CLICK TO LAUNCH</div>
            <div class="controls-hint">
                [MOUSE] MOVE STARSHIP<br>
                [HOLD MOUSE / SPACE] FIRE LASERS<br>
                COLLECT POWER-UPS TO UPGRADE CANNONS!
            </div>
        </div>

        <!-- Game Over Screen Overlay (hidden initially) -->
        <div id="gameover-screen" class="overlay" style="display: none;">
            <h1 class="title" style="color: #ff0055; text-shadow: 0 0 20px #ff0055;">MISSION FAILED</h1>
            <div class="subtitle" id="score-report" style="margin-bottom: 30px;">
                SCORE: 0<br><br>
                WAVE: 1<br><br>
                BEST: 0
            </div>
            <div class="subtitle blinking">CLICK TO RESTART</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const scoreReport = document.getElementById('score-report');
        const muteBtn = document.getElementById('mute-btn');
        const container = document.getElementById('game-container');

        // Game State Variables
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let wave = 1;
        let highScore = parseInt(localStorage.getItem('neon_high_score')) || 0;
        let frames = 0;
        let muted = false;
        let gameOverTime = 0;

        // Input Tracking
        const mouse = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            isDown: false
        };

        // Web Audio Synthesizer
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            muted = !muted;
            muteBtn.textContent = muted ? '🔇 MUTED' : '🔊 SOUND';
            muteBtn.style.borderColor = muted ? '#555' : '#00f3ff';
            muteBtn.style.color = muted ? '#555' : '#00f3ff';
        });

        // 8-bit Synth Audio Generators
        function playLaserSound() {
            if (muted) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(160, now + 0.08);

            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.08);
        }

        function playExplosionSound() {
            if (muted) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'square';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.linearRampToValueAtTime(30, now + 0.25);

            gain.gain.setValueAtTime(0.25, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start(now);
            osc.stop(now + 0.25);

            // Add white noise crackle
            try {
                const bufferSize = audioCtx.sampleRate * 0.2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(600, now);
                filter.frequency.linearRampToValueAtTime(50, now + 0.2);

                const nGain = audioCtx.createGain();
                nGain.gain.setValueAtTime(0.2, now);
                nGain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

                noise.connect(filter);
                filter.connect(nGain);
                nGain.connect(audioCtx.destination);
                noise.start(now);
                noise.stop(now + 0.2);
            } catch (err) {}
        }

        function playPowerupSound() {
            if (muted) return;
            initAudio();
            if (!audioCtx) return;

            const now = audioCtx.currentTime;
            [523.25, 659.25, 783.99, 1046.50].forEach((freq, index) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + index * 0.05);
                gain.gain.setValueAtTime(0.12, now + index * 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + index * 0.05 + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + index * 0.05);
                osc.stop(now + index * 0.05 + 0.08);
            });
        }

        // Parallax Starfield & Nebula System
        const stars = [];
        for (let i = 0; i < 90; i++) {
            stars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 2 + 0.5,
                speed: Math.random() * 1.5 + 0.4,
                alpha: Math.random() * 0.7 + 0.3
            });
        }

        function updateAndDrawStars() {
            // Draw Deep Space Nebula
            const nebulaGrad = ctx.createRadialGradient(
                canvas.width / 2 + Math.sin(frames * 0.01) * 60,
                canvas.height * 0.4 + Math.cos(frames * 0.01) * 40,
                30,
                canvas.width / 2,
                canvas.height * 0.4,
                300
            );
            nebulaGrad.addColorStop(0, 'rgba(80, 10, 90, 0.22)');
            nebulaGrad.addColorStop(0.5, 'rgba(10, 30, 80, 0.15)');
            nebulaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
            ctx.fillStyle = nebulaGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Stars
            ctx.fillStyle = '#fff';
            stars.forEach(star => {
                star.y += star.speed;
                if (star.y > canvas.height) {
                    star.y = 0;
                    star.x = Math.random() * canvas.width;
                }
                ctx.globalAlpha = star.alpha;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });
            ctx.globalAlpha = 1.0;
        }

        // Particle Glow Engine
        const particles = [];
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 4 + 1;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.size = Math.random() * 3 + 2;
                this.alpha = 1.0;
                this.decay = Math.random() * 0.03 + 0.02;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        function createExplosion(x, y, color, count = 18) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // Laser Projectiles
        const lasers = [];
        class Laser {
            constructor(x, y, vx = 0, vy = -11, color = '#00f3ff') {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.width = 4;
                this.height = 14;
                this.color = color;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
            }

            draw() {
                ctx.save();
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 12;
                ctx.fillStyle = '#fff';
                ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x - this.width / 2, this.y, this.width, this.height);
                ctx.restore();
            }
        }

        // Power-Ups
        const powerups = [];
        class PowerUp {
            constructor(x, y, type) {
                this.x = x;
                this.y = y;
                this.type = type; // 'double', 'triple', 'shield'
                this.size = 14;
                this.vy = 1.6;
                this.angle = 0;
            }

            update() {
                this.y += this.vy;
                this.angle += 0.04;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                let color = '#ffea00';
                if (this.type === 'shield') color = '#00f3ff';
                if (this.type === 'triple') color = '#ff007f';

                ctx.shadowColor = color;
                ctx.shadowBlur = 14;
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);

                ctx.fillStyle = '#fff';
                ctx.font = '8px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                const label = this.type === 'shield' ? 'S' : (this.type === 'triple' ? '3' : '2');
                ctx.fillText(label, 0, 1);

                ctx.restore();
            }
        }

        // Enemies
        const enemies = [];
        class Enemy {
            constructor(x, y, type, speed) {
                this.x = x;
                this.y = y;
                this.type = type; // 'scout', 'fighter', 'boss'
                this.speed = speed;
                this.width = type === 'boss' ? 52 : (type === 'fighter' ? 34 : 26);
                this.height = type === 'boss' ? 42 : (type === 'fighter' ? 28 : 22);
                this.hp = type === 'boss' ? 14 : (type === 'fighter' ? 3 : 1);
                this.maxHp = this.hp;
                this.color = type === 'boss' ? '#ff0055' : (type === 'fighter' ? '#ffaa00' : '#a200ff');
                this.shootCooldown = Math.floor(Math.random() * 80) + 60;
            }

            update() {
                this.y += this.speed;

                // Subtle wavy drift for scouts
                if (this.type === 'scout') {
                    this.x += Math.sin(frames * 0.05 + this.y * 0.05) * 1.5;
                }

                // Enemy shooting (fighters & boss)
                if (this.type !== 'scout' && gameState === 'PLAYING') {
                    this.shootCooldown--;
                    if (this.shootCooldown <= 0) {
                        this.shootCooldown = this.type === 'boss' ? 50 : 100;
                        enemyLasers.push(new Laser(this.x, this.y + this.height / 2, 0, 4.5, '#ff0055'));
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 12;

                // Draw neon spaceship geometry
                ctx.strokeStyle = this.color;
                ctx.fillStyle = '#150a24';
                ctx.lineWidth = 2.5;

                ctx.beginPath();
                if (this.type === 'boss') {
                    // Massive cruiser
                    ctx.moveTo(0, this.height / 2);
                    ctx.lineTo(-this.width / 2, -this.height / 4);
                    ctx.lineTo(-this.width / 4, -this.height / 2);
                    ctx.lineTo(this.width / 4, -this.height / 2);
                    ctx.lineTo(this.width / 2, -this.height / 4);
                } else if (this.type === 'fighter') {
                    // Winged interceptor
                    ctx.moveTo(0, this.height / 2);
                    ctx.lineTo(-this.width / 2, -this.height / 2);
                    ctx.lineTo(0, -this.height / 4);
                    ctx.lineTo(this.width / 2, -this.height / 2);
                } else {
                    // Small dart scout
                    ctx.moveTo(0, this.height / 2);
                    ctx.lineTo(-this.width / 2, -this.height / 2);
                    ctx.lineTo(this.width / 2, -this.height / 2);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Core glowing orb inside enemy
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(0, 0, this.type === 'boss' ? 6 : 3, 0, Math.PI * 2);
                ctx.fill();

                // Health bar for boss/fighter
                if (this.hp > 1) {
                    const barW = this.width;
                    const fillW = (this.hp / this.maxHp) * barW;
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.fillRect(-barW / 2, -this.height / 2 - 8, barW, 4);
                    ctx.fillStyle = this.color;
                    ctx.fillRect(-barW / 2, -this.height / 2 - 8, fillW, 4);
                }

                ctx.restore();
            }
        }

        const enemyLasers = [];

        // The Player Ship
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 100,
            targetX: canvas.width / 2,
            targetY: canvas.height - 100,
            width: 32,
            height: 36,
            weaponType: 'single', // 'single', 'double', 'triple'
            shield: false,
            fireCooldown: 0,
            tilt: 0,

            update() {
                // Smooth Lerp towards mouse coords
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                this.x += dx * 0.16;
                this.y += dy * 0.16;

                // Restrict inside canvas borders
                this.x = Math.max(this.width / 2 + 5, Math.min(canvas.width - this.width / 2 - 5, this.x));
                this.y = Math.max(100, Math.min(canvas.height - this.height / 2 - 10, this.y));

                // Natural ship tilt on movement
                this.tilt = Math.max(-0.35, Math.min(0.35, dx * 0.03));

                // Auto-firing when clicking or holding
                if (mouse.isDown && gameState === 'PLAYING') {
                    if (this.fireCooldown <= 0) {
                        this.shoot();
                        this.fireCooldown = 12; // Laser frequency
                    }
                }
                if (this.fireCooldown > 0) this.fireCooldown--;

                // Engine exhaust particles
                if (frames % 2 === 0) {
                    particles.push(new Particle(
                        this.x + (Math.random() - 0.5) * 8,
                        this.y + this.height / 2,
                        '#00f3ff'
                    ));
                }
            },

            shoot() {
                playLaserSound();
                if (this.weaponType === 'single') {
                    lasers.push(new Laser(this.x, this.y - this.height / 2, 0, -12, '#00f3ff'));
                } else if (this.weaponType === 'double') {
                    lasers.push(new Laser(this.x - 10, this.y - this.height / 4, 0, -12, '#ffea00'));
                    lasers.push(new Laser(this.x + 10, this.y - this.height / 4, 0, -12, '#ffea00'));
                } else if (this.weaponType === 'triple') {
                    lasers.push(new Laser(this.x, this.y - this.height / 2, 0, -12, '#ff007f'));
                    lasers.push(new Laser(this.x - 12, this.y - this.height / 4, -1.8, -12, '#ff007f'));
                    lasers.push(new Laser(this.x + 12, this.y - this.height / 4, 1.8, -12, '#ff007f'));
                }
            },

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.tilt);

                // Shield bubble glow
                if (this.shield) {
                    ctx.save();
                    ctx.shadowColor = '#00f3ff';
                    ctx.shadowBlur = 18;
                    ctx.strokeStyle = `rgba(0, 243, 255, ${0.6 + Math.sin(frames * 0.1) * 0.3})`;
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(0, 0, this.width, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }

                // Starship Body (Neon Cyberpunk Dart)
                ctx.shadowColor = '#00f3ff';
                ctx.shadowBlur = 15;
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = '#00f3ff';
                ctx.fillStyle = '#08172c';

                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2);
                ctx.lineTo(this.width / 2, this.height / 2);
                ctx.lineTo(this.width / 4, this.height / 3);
                ctx.lineTo(-this.width / 4, this.height / 3);
                ctx.lineTo(-this.width / 2, this.height / 2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Glowing cockpit window
                ctx.fillStyle = '#fff';
                ctx.shadowColor = '#fff';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 3);
                ctx.lineTo(3, 0);
                ctx.lineTo(-3, 0);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            },

            reset() {
                this.x = canvas.width / 2;
                this.y = canvas.height - 100;
                this.targetX = this.x;
                this.targetY = this.y;
                this.weaponType = 'single';
                this.shield = false;
                this.fireCooldown = 0;
            }
        };

        // Enemy Waves Spawner
        let spawnTimer = 0;
        function updateEnemySpawner() {
            if (gameState !== 'PLAYING') return;

            spawnTimer++;
            // Calculate spawn frequency scaled with wave progression
            const spawnRate = Math.max(35, 80 - wave * 4);
            if (spawnTimer % spawnRate === 0) {
                const randX = Math.random() * (canvas.width - 60) + 30;
                const randType = Math.random();

                if (randType > 0.85 && wave >= 2) {
                    enemies.push(new Enemy(randX, -40, 'fighter', 1.8 + wave * 0.15));
                } else if (randType > 0.95 && wave >= 3) {
                    enemies.push(new Enemy(randX, -50, 'boss', 1.2 + wave * 0.1));
                } else {
                    enemies.push(new Enemy(randX, -30, 'scout', 2.3 + wave * 0.2));
                }
            }

            // Wave progression increment
            if (frames % 1200 === 0 && gameState === 'PLAYING') {
                wave++;
            }
        }

        // Collision Management
        function handleCollisions() {
            // 1. Player Lasers vs Enemies
            for (let l = lasers.length - 1; l >= 0; l--) {
                const laser = lasers[l];
                for (let e = enemies.length - 1; e >= 0; e--) {
                    const enemy = enemies[e];
                    if (
                        laser.x > enemy.x - enemy.width / 2 &&
                        laser.x < enemy.x + enemy.width / 2 &&
                        laser.y > enemy.y - enemy.height / 2 &&
                        laser.y < enemy.y + enemy.height / 2
                    ) {
                        lasers.splice(l, 1);
                        enemy.hp--;
                        createExplosion(laser.x, laser.y, laser.color, 4);

                        if (enemy.hp <= 0) {
                            playExplosionSound();
                            createExplosion(enemy.x, enemy.y, enemy.color, 20);
                            score += enemy.type === 'boss' ? 150 : (enemy.type === 'fighter' ? 40 : 15);
                            if (score > highScore) {
                                highScore = score;
                                localStorage.setItem('neon_high_score', highScore);
                            }

                            // Powerup drop chance (15%)
                            if (Math.random() < 0.18) {
                                const types = ['double', 'triple', 'shield'];
                                const pType = types[Math.floor(Math.random() * types.length)];
                                powerups.push(new PowerUp(enemy.x, enemy.y, pType));
                            }

                            enemies.splice(e, 1);
                        }
                        break;
                    }
                }
            }

            // 2. Power-ups vs Player
            for (let p = powerups.length - 1; p >= 0; p--) {
                const pu = powerups[p];
                const dist = Math.hypot(player.x - pu.x, player.y - pu.y);
                if (dist < player.width / 2 + pu.size) {
                    playPowerupSound();
                    createExplosion(pu.x, pu.y, '#ffea00', 12);
                    if (pu.type === 'shield') {
                        player.shield = true;
                    } else {
                        player.weaponType = pu.type;
                    }
                    powerups.splice(p, 1);
                }
            }

            // 3. Enemy Lasers vs Player
            for (let el = enemyLasers.length - 1; el >= 0; el--) {
                const elaser = enemyLasers[el];
                const dist = Math.hypot(player.x - elaser.x, player.y - elaser.y);
                if (dist < player.width / 2 + 5) {
                    enemyLasers.splice(el, 1);
                    if (player.shield) {
                        player.shield = false;
                        createExplosion(player.x, player.y, '#00f3ff', 16);
                        playExplosionSound();
                    } else {
                        triggerGameOver();
                    }
                }
            }

            // 4. Enemy Body vs Player
            for (let e = enemies.length - 1; e >= 0; e--) {
                const enemy = enemies[e];
                const dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if (dist < (player.width + enemy.width) / 2.8) {
                    createExplosion(enemy.x, enemy.y, enemy.color, 16);
                    enemies.splice(e, 1);
                    if (player.shield) {
                        player.shield = false;
                        playExplosionSound();
                    } else {
                        triggerGameOver();
                    }
                }
            }
        }

        // Draw HUD overlay
        function drawHUD() {
            if (gameState !== 'PLAYING') return;

            ctx.save();
            ctx.font = '10px "Press Start 2P"';
            ctx.fillStyle = '#00f3ff';
            ctx.shadowColor = '#00f3ff';
            ctx.shadowBlur = 8;

            // Score & Wave
            ctx.textAlign = 'left';
            ctx.fillText(`SCORE: ${score}`, 20, 32);

            ctx.textAlign = 'right';
            ctx.fillText(`WAVE ${wave}`, canvas.width - 20, 32);

            // Weapon & Shield Indicator
            ctx.font = '8px "Press Start 2P"';
            ctx.fillStyle = '#aaa';
            ctx.textAlign = 'left';
            const weaponLabel = `WEAPON: ${player.weaponType.toUpperCase()}`;
            ctx.fillText(weaponLabel, 20, canvas.height - 20);

            if (player.shield) {
                ctx.fillStyle = '#00f3ff';
                ctx.textAlign = 'right';
                ctx.fillText(`SHIELD: ACTIVE`, canvas.width - 20, canvas.height - 20);
            }
            ctx.restore();
        }

        // Game Flow Handlers
        function startGame() {
            gameState = 'PLAYING';
            score = 0;
            wave = 1;
            spawnTimer = 0;
            player.reset();
            lasers.length = 0;
            enemyLasers.length = 0;
            enemies.length = 0;
            powerups.length = 0;
            particles.length = 0;

            startScreen.style.display = 'none';
            gameoverScreen.style.display = 'none';
            initAudio();
        }

        function triggerGameOver() {
            if (gameState === 'GAMEOVER') return;
            gameState = 'GAMEOVER';
            gameOverTime = Date.now();
            playExplosionSound();
            createExplosion(player.x, player.y, '#00f3ff', 35);
            createExplosion(player.x, player.y, '#ff0055', 30);

            setTimeout(() => {
                scoreReport.innerHTML = `SCORE: ${score}<br><br>WAVE: ${wave}<br><br>BEST: ${highScore}`;
                gameoverScreen.style.display = 'flex';
            }, 400);
        }

        // Mouse & Touch Tracking
        function updateMousePosition(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;

            player.targetX = (clientX - rect.left) * scaleX;
            player.targetY = (clientY - rect.top) * scaleY;
        }

        window.addEventListener('mousemove', (e) => {
            updateMousePosition(e.clientX, e.clientY);
        });

        window.addEventListener('mousedown', (e) => {
            if (e.target === muteBtn) return;
            mouse.isDown = true;
            if (gameState === 'START') {
                startGame();
            } else if (gameState === 'GAMEOVER') {
                if (Date.now() - gameOverTime > 500 && gameoverScreen.style.display === 'flex') {
                    startGame();
                }
            }
        });

        window.addEventListener('mouseup', () => {
            mouse.isDown = false;
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                updateMousePosition(e.touches[0].clientX, e.touches[0].clientY);
            }
        }, { passive: true });

        window.addEventListener('touchstart', (e) => {
            if (e.target === muteBtn) return;
            mouse.isDown = true;
            if (e.touches.length > 0) {
                updateMousePosition(e.touches[0].clientX, e.touches[0].clientY);
            }
            if (gameState === 'START') {
                startGame();
            } else if (gameState === 'GAMEOVER') {
                if (Date.now() - gameOverTime > 500 && gameoverScreen.style.display === 'flex') {
                    startGame();
                }
            }
        }, { passive: true });

        window.addEventListener('touchend', () => {
            mouse.isDown = false;
        });

        // Keyboard Spacebar shooting fallback
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                mouse.isDown = true;
                if (gameState === 'START') startGame();
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'Space') mouse.isDown = false;
        });

        // Main Animation Engine Loop
        function loop() {
            frames++;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Environment & Background
            updateAndDrawStars();

            // 2. Entities & Spawner
            updateEnemySpawner();

            // Update Lasers
            for (let i = lasers.length - 1; i >= 0; i--) {
                lasers[i].update();
                lasers[i].draw();
                if (lasers[i].y < -20) lasers.splice(i, 1);
            }

            // Update Enemy Lasers
            for (let i = enemyLasers.length - 1; i >= 0; i--) {
                enemyLasers[i].update();
                enemyLasers[i].draw();
                if (enemyLasers[i].y > canvas.height + 20) enemyLasers.splice(i, 1);
            }

            // Update Powerups
            for (let i = powerups.length - 1; i >= 0; i--) {
                powerups[i].update();
                powerups[i].draw();
                if (powerups[i].y > canvas.height + 20) powerups.splice(i, 1);
            }

            // Update Enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update();
                enemies[i].draw();
                if (enemies[i].y > canvas.height + 60) enemies.splice(i, 1);
            }

            // 3. Player Starship
            if (gameState !== 'GAMEOVER') {
                player.update();
                player.draw();
            }

            // 4. Particles & Collision
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

            if (gameState === 'PLAYING') {
                handleCollisions();
            }

            // 5. Interface HUD
            drawHUD();

            requestAnimationFrame(loop);
        }

        // Launch game loop
        loop();
    </script>
</body>
</html>
